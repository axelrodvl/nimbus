[package]
name = "nimbus-api"
version.workspace = true
edition.workspace = true

[features]
# NIMBUS_FAKE_EXTERNAL: фейковые MusicBrainz/Torznab и локальный сидер (только для e2e).
test-fakes = ["nimbus-torrent/test-fakes"]

[dependencies]
nimbus-core.workspace = true
reqwest.workspace = true
nimbus-db.workspace = true
nimbus-worker.workspace = true
nimbus-musicbrainz.workspace = true
nimbus-library.workspace = true
nimbus-trackers.workspace = true
nimbus-torrent.workspace = true
utoipa.workspace = true
uuid.workspace = true
futures.workspace = true
tokio-util = { workspace = true, features = ["io"] }
chrono.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
subtle = "2"

[dev-dependencies]
http-body-util = "0.1"
wiremock.workspace = true
tokio-tungstenite = "0.26"
rand = "0.9"
nimbus-testkit.workspace = true
async-trait.workspace = true

[[bin]]
name = "nimbus"
path = "src/main.rs"

[lib]
name = "nimbus_api"
path = "src/lib.rs"

[lints]
workspace = true
