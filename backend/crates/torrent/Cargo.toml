[package]
name = "nimbus-torrent"
version.workspace = true
edition.workspace = true

[features]
# Локальный сидер для e2e (не для боевой сборки).
test-fakes = []

[dependencies]
nimbus-core.workspace = true
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
bytes.workspace = true

[dev-dependencies]
rand = "0.9"
nimbus-testkit.workspace = true
tempfile = "3"
# Тесты роя используют fake_swarm из этого же крейта.
nimbus-torrent = { path = ".", features = ["test-fakes"] }

[lints]
workspace = true
