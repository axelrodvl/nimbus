[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.12.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "compression-br"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip", "socks"] }
async-trait = "0.1"
futures = "0.3"
wiremock = "0.6"
dotenvy = "0.15"
utoipa = { version = "5", features = ["uuid", "chrono"] }

nimbus-core = { path = "crates/core" }
nimbus-db = { path = "crates/db" }
nimbus-worker = { path = "crates/worker" }
nimbus-musicbrainz = { path = "crates/musicbrainz" }
nimbus-library = { path = "crates/library" }
nimbus-trackers = { path = "crates/trackers" }
nimbus-torrent = { path = "crates/torrent" }
nimbus-matcher = { path = "crates/matcher" }
nimbus-testkit = { path = "crates/testkit" }
tokio-util = "0.7"
bytes = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
