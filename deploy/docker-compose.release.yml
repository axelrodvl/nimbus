# Запуск из готовых образов GHCR (без сборки). Лежит в пакете релиза как docker-compose.yml.
# Версия берётся из NIMBUS_VERSION (.env), по умолчанию latest.
# Из репозитория запускается корневыми ./start.sh и ./stop.sh; то же имя проекта, что у docker-compose.yml (стек один).
name: nimbus

services:
  db:
    image: postgres:17
    # init: PID 1 — tini, а не postmaster. Иначе осиротевший pg_isready проверки здоровья (под нагрузкой проверка
    # не укладывается в timeout, Docker убивает её оболочку) достаётся postmaster'у: тот принимает чужой
    # код выхода 2 за падение своего процесса и перезапускает все соединения (crash recovery).
    init: true
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nimbus", "-t", "2"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  nimbus:
    image: ghcr.io/axelrodvl/nimbus:${NIMBUS_VERSION:-latest}
    # Штатная остановка занимает до ≈ 15 с (дренаж HTTP 5 с, воркеры до 10 с, движок); см. docs/operations.md.
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://nimbus:nimbus@db:5432/nimbus
      NIMBUS_BIND: 0.0.0.0:8080
      NIMBUS_DATA_DIR: /data
      NIMBUS_TORRENT_PORT: ${NIMBUS_TORRENT_PORT:-6881}
    volumes:
      - ./data:/data
    ports:
      # Интерфейс и API на одном origin.
      - "${NIMBUS_PORT:-8000}:8080"
      # Входящие BitTorrent-соединения.
      - "${NIMBUS_TORRENT_PORT:-6881}:${NIMBUS_TORRENT_PORT:-6881}/tcp"
      - "${NIMBUS_TORRENT_PORT:-6881}:${NIMBUS_TORRENT_PORT:-6881}/udp"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  pgdata:
