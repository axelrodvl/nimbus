name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Запустить e2e (docker compose, долго)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
          POSTGRES_DB: nimbus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimbus" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://nimbus:nimbus@localhost:5432/nimbus
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Версия закреплена: llvm-cov по-разному считает строки в разных rustc (на 1.100.0 worker даёт 93.55 % вместо 95.21 %
      # на 1.99.1 при тех же тестах). Обновлять осознанно — вместе с проверкой порогов `just backend-cov`.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features nimbus-api/test-fakes -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: extractions/setup-just@v2
      # Тесты выполняются один раз — внутри llvm-cov; порог — backend/coverage-threshold.txt.
      - name: Тесты и покрытие
        working-directory: .
        run: |
          set -o pipefail
          just backend-cov | tee cov.txt
          { echo '### Покрытие бэкенда'; echo '```'; cat cov.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: client/openapi.json совпадает с бэкендом
        run: |
          cargo run -q -p nimbus-api --bin nimbus -- --print-openapi | diff -u ../client/openapi.json - \
            || { echo "::error::client/openapi.json устарел — выполни just openapi"; exit 1; }

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Документация сверяется с кодом: OpenAPI ↔ docs/api.md, NIMBUS_* ↔ docs/operations.md и .env.example.
      - run: bun ../scripts/check-docs.ts
      - run: bun run test:cov
      # Сборка включает проверку бюджета размера (scripts/check-bundle.ts, bundle-budget.json).
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e --trace off
      # Аудит интерфейса (скриншоты, axe, клавиатура) и бюджеты производительности (шаг 49).
      - run: bunx playwright test --config playwright.audit.config.ts
      - run: bunx playwright test --config playwright.perf.config.ts
        env:
          PERF_SLACK: '2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-audit-screenshots
          path: client/test-results/audit
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v2
      - run: bun install --frozen-lockfile
        working-directory: client
      - run: bunx playwright install --with-deps chromium
        working-directory: client
      - run: just e2e
