name: Release

# Релиз: написать docs/releases/v1.2.3.md, затем git tag v1.2.3 && git push --tags
# Собирает образ nimbus (бэкенд + SPA; linux/amd64 + linux/arm64) в GHCR и создаёт GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: nimbus (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Имя образа и суффикс платформы
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/nimbus" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=nimbus-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=nimbus-${{ env.PLATFORM_PAIR }}
      - name: Сохранить digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: manifest nimbus
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Имя образа
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/nimbus" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Собрать мульти-архитектурный манифест
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Проверка
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны для ссылки «Full changelog»
      - name: Release notes (docs/releases/${{ github.ref_name }}.md)
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Собрать пакет для запуска
        run: |
          mkdir -p dist/nimbus
          cp deploy/docker-compose.release.yml dist/nimbus/docker-compose.yml
          cp deploy/Caddyfile dist/nimbus/Caddyfile.example
          cp .env.example dist/nimbus/.env.example
          # Привязать пакет к версии релиза.
          sed -i "s/^NIMBUS_VERSION=.*/NIMBUS_VERSION=${GITHUB_REF_NAME#v}/" dist/nimbus/.env.example
          cd dist
          zip -r "nimbus-${GITHUB_REF_NAME}.zip" nimbus
          tar czf "nimbus-${GITHUB_REF_NAME}.tar.gz" nimbus
      - uses: softprops/action-gh-release@v2
        with:
          name: Nimbus ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/nimbus-*.zip
            dist/nimbus-*.tar.gz
