name: Release

# Релиз: написать docs/releases/v1.2.3.md, поднять версию, затем git tag -a v1.2.3 -m v1.2.3 && git push origin main v1.2.3
# Порядок: preflight (тег ↔ версии, release notes) и полный CI (ci.yml через workflow_call) → сборка образа nimbus
# (бэкенд + SPA; linux/amd64 + linux/arm64) в GHCR → манифест с тегами → GitHub Release.
# Если CI или preflight упали, образы не собираются, теги в GHCR не двигаются и релиз не создаётся.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release-notes.sh ищет предыдущий тег
      - name: Версия в тег совпадает с версией в коде
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want=${GITHUB_REF_NAME#v}
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' backend/Cargo.toml)
          pkg=$(jq -r .version client/package.json)
          api=$(jq -r .info.version client/openapi.json)
          echo "tag=$want Cargo.toml=$cargo package.json=$pkg openapi.json=$api"
          for v in "$cargo" "$pkg" "$api"; do
            [[ "$v" == "$want" ]] || { echo "::error::версия в коде не совпадает с тегом $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Release notes (docs/releases/${{ github.ref_name }}.md)
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [preflight, ci]
    permissions:
      contents: read
      packages: write
    name: nimbus (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Имя образа и суффикс платформы
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/nimbus" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=nimbus-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=nimbus-${{ env.PLATFORM_PAIR }}
      - name: Сохранить digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: manifest nimbus
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Имя образа
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/nimbus" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Собрать мульти-архитектурный манифест
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Проверка
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # теги нужны для ссылки «Full changelog»
      - name: Release notes (docs/releases/${{ github.ref_name }}.md)
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: Собрать пакет для запуска
        run: |
          mkdir -p dist/nimbus
          cp deploy/docker-compose.release.yml dist/nimbus/docker-compose.yml
          cp deploy/Caddyfile dist/nimbus/Caddyfile.example
          cp .env.example dist/nimbus/.env.example
          # Привязать пакет к версии релиза.
          sed -i "s/^NIMBUS_VERSION=.*/NIMBUS_VERSION=${GITHUB_REF_NAME#v}/" dist/nimbus/.env.example
          cd dist
          zip -r "nimbus-${GITHUB_REF_NAME}.zip" nimbus
          tar czf "nimbus-${GITHUB_REF_NAME}.tar.gz" nimbus
      - uses: softprops/action-gh-release@v2
        with:
          name: Nimbus ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/nimbus-*.zip
            dist/nimbus-*.tar.gz
