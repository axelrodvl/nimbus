# Полный стек Nimbus. Собирать — ./scripts/build.sh, запускать — ./scripts/start.sh, останавливать — ./scripts/stop.sh.
# Фиксированное имя проекта и образа: не зависят от имени каталога. Два сервиса: db и nimbus (бэкенд + SPA).
name: nimbus

services:
  db:
    image: postgres:17
    shm_size: 512mb
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus"]
      interval: 2s
      timeout: 3s
      retries: 30

  nimbus:
    image: nimbus:local
    build:
      context: .
      args:
        CARGO_FEATURES: ${CARGO_FEATURES:-}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://nimbus:nimbus@db:5432/nimbus
      NIMBUS_BIND: 0.0.0.0:8080
      NIMBUS_DATA_DIR: /data
      NIMBUS_TORRENT_PORT: ${NIMBUS_TORRENT_PORT:-6881}
    volumes:
      - ./data:/data
    ports:
      # Интерфейс и API на одном origin.
      - "${NIMBUS_PORT:-8000}:8080"
      # Входящие BitTorrent-соединения.
      - "${NIMBUS_TORRENT_PORT:-6881}:${NIMBUS_TORRENT_PORT:-6881}/tcp"
      - "${NIMBUS_TORRENT_PORT:-6881}:${NIMBUS_TORRENT_PORT:-6881}/udp"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    # librqbit держит открытыми файлы всех восстановленных торрентов; дефолтных 1024 не хватает.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # VPN для BitTorrent (по умолчанию выключено): запустите контейнер gluetun и раскомментируйте
    #   network_mode: "service:gluetun"
    # (тогда `ports`/`depends_on` перенесите на gluetun).

volumes:
  pgdata:
