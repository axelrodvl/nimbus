services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        CARGO_FEATURES: ${CARGO_FEATURES:-}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://nimbus:nimbus@db:5432/nimbus
      NIMBUS_BIND: 0.0.0.0:8080
      NIMBUS_DATA_DIR: /data
      # Один origin через caddy: CORS не нужен.
      NIMBUS_CORS_ORIGIN: http://localhost:8000
    volumes:
      - ./data:/data
    ports:
      # Входящие BitTorrent-соединения.
      - "6881:6881/tcp"
      - "6881:6881/udp"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
    # VPN для BitTorrent (по умолчанию выключено): запустите контейнер gluetun и раскомментируйте
    #   network_mode: "service:gluetun"
    # (тогда `ports`/`depends_on` перенесите на gluetun, а caddy должен ходить на gluetun:8080).

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_BACKEND_URL: ""
    environment:
      BACKEND_URL: http://backend:8080
      # Тот же токен, что у бэкенда: сервер Next ходит с ним в API и проверяет cookie входа.
      NIMBUS_API_TOKEN: ${NIMBUS_API_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "${NIMBUS_PORT:-8000}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
